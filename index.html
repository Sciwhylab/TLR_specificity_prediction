<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anuja | Research & Collaboration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.55),
                    rgba(0, 0, 0, 0.65)
                ),
                url("https://images.unsplash.com/photo-1461896836934-ffe607ba8211?auto=format&fit=crop&w=2000&q=85")
                center center / cover no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
            overflow: hidden;
        }

        /* Dark overlay */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(
                circle at center,
                rgba(255,255,255,0.05),
                rgba(0,0,0,0.45)
            );
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;

            width: min(90%, 900px);
            padding: 70px 40px;

            text-align: center;

            background: rgba(20, 20, 20, 0.42);
            border: 1px solid rgba(255,255,255,0.2);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            border-radius: 25px;

            box-shadow:
                0 25px 70px rgba(0,0,0,0.5);

            animation: fadeIn 1.5s ease;
        }

        .name {
            font-size: clamp(4rem, 12vw, 9rem);
            font-weight: 800;
            letter-spacing: 8px;
            text-transform: uppercase;

            background: linear-gradient(
                90deg,
                #ffffff,
                #d9d9d9,
                #ffffff
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            text-shadow: 0 10px 35px rgba(0,0,0,0.35);
        }

        .line {
            width: 90px;
            height: 4px;

            margin: 25px auto;

            background: white;
            border-radius: 10px;
        }

        .tagline {
            font-size: clamp(1.1rem, 2.5vw, 1.5rem);
            line-height: 1.7;

            max-width: 700px;
            margin: auto;

            color: rgba(255,255,255,0.92);
        }

        .highlight {
            font-weight: 700;
            color: white;
        }

        .research {
            margin-top: 25px;

            font-size: 1rem;
            letter-spacing: 1px;

            color: rgba(255,255,255,0.7);
        }

        .button {
            display: inline-block;

            margin-top: 35px;
            padding: 14px 32px;

            border: 1px solid rgba(255,255,255,0.6);
            border-radius: 50px;

            color: white;
            text-decoration: none;

            font-size: 1rem;
            font-weight: 600;

            transition: all 0.3s ease;
        }

        .button:hover {
            background: white;
            color: black;

            transform: translateY(-3px);

            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
        }

        .footer {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;

            text-align: center;

            font-size: 0.8rem;
            color: rgba(255,255,255,0.55);

            z-index: 2;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile */
        @media (max-width: 600px) {

            .container {
                padding: 50px 25px;
            }

            .name {
                letter-spacing: 4px;
            }

            .tagline {
                font-size: 1rem;
            }

            .research {
                font-size: 0.85rem;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <h1 class="name">Anuja</h1>

        <div class="line"></div>

        <p class="tagline">
            I am open to
            <span class="highlight">collaborating</span>
            on research proposals, interdisciplinary projects,
            and innovative scientific ideas.
        </p>

        <p class="research">
            Computational Biology • Bioinformatics • AI & ML • Structural Biology • Life Sciences
        </p>

        <a href="mailto:your-email@example.com" class="button">
            Let's Collaborate
        </a>

    </main>

    <div class="footer">
        Research • Collaboration • Innovation
    </div>

</body>
</html>
